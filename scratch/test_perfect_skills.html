<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Perfect Uniform Skills Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #02040a;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 40px;
    }

    .perspective-stage {
      perspective: 1200px;
      perspective-origin: 45% 40%;
    }

    .macropad-body {
      transform-style: preserve-3d;
      transform: rotateX(46deg) rotateY(-6deg) rotateZ(-36deg);
      background: #07090e;
      border-radius: 22px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.2) inset,
        0 -1px 0 rgba(0, 0, 0, 0.95) inset,
        -1px 2px 0 #05070a,
        -2px 5px 0 #030407,
        -4px 9px 0 #020305,
        -6px 15px 0 #010203,
        -10px 24px 38px rgba(0,0,0,0.98),
        -16px 42px 60px rgba(0,0,0,0.95);
    }

    .switch-plate {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      background: #000002;
      border-radius: 16px;
      padding: 6px;
      box-shadow: inset 0 6px 25px rgba(0, 0, 0, 0.99);
      transform-style: preserve-3d;
    }

    /* 
      AUTHENTIC SA PROFILE UNIFORM MECHANICAL KEYCAP:
      - Strictly uniform 60px x 60px size
      - Calibrated 7-layer extrusion that fits precisely inside the gap
      - Proper z-index layering so shadows never clip or overlap adjacent keys
    */
    .keycap-btn {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 12px;
      padding: 5px;
      background: linear-gradient(135deg, var(--side) 0%, var(--side-dark) 100%);
      border: none;
      outline: none;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform 0.08s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.08s cubic-bezier(0.2, 0.8, 0.2, 1);
      
      box-shadow:
        0 1px 1px rgba(255, 255, 255, 0.45) inset,
        -1px 1px 0 var(--side),
        -2px 2px 0 var(--side),
        -3px 3px 0 var(--side-dark),
        -4px 4px 0 var(--side-dark),
        -5px 5px 0 #060910,
        -6px 6px 0 #020306,
        -8px 9px 12px rgba(0, 0, 0, 0.95),
        -4px 5px 6px rgba(0, 0, 0, 0.8);
    }

    .keycap-btn:hover {
      transform: translate(-1.5px, 1.5px);
    }

    .keycap-btn:active, .keycap-btn.pressed {
      transform: translate(-5px, 5px);
      box-shadow:
        -1px 1px 0 #020305,
        -2px 2px 4px rgba(0, 0, 0, 0.9),
        inset 0 2px 5px rgba(0, 0, 0, 0.7);
    }

    .keycap-top {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 1.5px 1px rgba(255, 255, 255, 0.55) inset,
        0 -1px 2px rgba(0, 0, 0, 0.5) inset,
        -1px 1.5px 2px rgba(0, 0, 0, 0.35);
    }

    .keycap-dish {
      position: absolute;
      inset: 2px;
      border-radius: 6px;
      background: radial-gradient(circle at 45% 30%, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 65%);
      box-shadow: inset 0 1.5px 3px rgba(255, 255, 255, 0.4), inset 0 -1.5px 3px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    .keycap-content {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      filter: drop-shadow(0 1.5px 2px rgba(0, 0, 0, 0.6));
    }

    .keycap-ring {
      position: absolute;
      inset: 0;
      border-radius: 8px;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.95), 0 0 15px rgba(255, 255, 255, 0.6);
      pointer-events: none;
    }
  </style>
</head>

    const container = document.getElementById('switchPlate');

    SKILLS.forEach((skill, index) => {
      const btn = document.createElement('button');
      btn.className = 'keycap-btn' + (index === 4 ? ' active' : '');
      btn.style.setProperty('--bg', skill.bg);
      btn.style.setProperty('--side', skill.side);
      btn.style.setProperty('--side-dark', skill.sideDark);
      
      // PERFECT STACKING: rows further down (closer) and columns to the left (closer) render on top
      const zIndex = (skill.row * 10) + (6 - skill.col);
      btn.style.zIndex = zIndex;
      btn.title = skill.name;

      let inner = '';
      if (skill.type === 'text') {
        inner = `<span class="font-black text-xl tracking-tight leading-none ${skill.isItalic ? 'italic' : ''}" style="color: ${skill.textCol}">${skill.val}</span>`;
      } else if (ICONS[skill.type]) {
        inner = ICONS[skill.type];
      }

      btn.innerHTML = `
        <div class="keycap-top">
          <div class="keycap-dish"></div>
          <div class="keycap-content">${inner}</div>
          ${index === 4 ? '<div class="keycap-ring"></div>' : ''}
        </div>
      `;

      btn.addEventListener('click', () => {
        document.querySelectorAll('.keycap-ring').forEach(r => r.remove());
        btn.querySelector('.keycap-top').insertAdjacentHTML('beforeend', '<div class="keycap-ring"></div>');
        btn.classList.add('pressed');
        btn.style.zIndex = 100;
        setTimeout(() => {
          btn.classList.remove('pressed');
          btn.style.zIndex = zIndex;
        }, 140);
      });

      container.appendChild(btn);
    });
  </script>
