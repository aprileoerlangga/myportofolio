<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Mechanical Keyboard Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0b071a;
      color: #fff;
      overflow-x: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .keyboard-stage {
      perspective: 1400px;
      perspective-origin: 50% 35%;
    }

    /* 
      Authentic 3D Wedge Chassis (Elevated back, thick side walls)
      Orientation: nyerong dari bawah-kiri ke atas-kanan
    */
    .keyboard-chassis {
      transform-style: preserve-3d;
      transform: rotateX(56deg) rotateY(10deg) rotateZ(-38deg);
      box-shadow:
        /* Top rim specular highlight */
        0 1px 0 rgba(255, 255, 255, 0.25) inset,
        /* Thick chassis extrusion (simulating solid beveled case) */
        -1px 2px 0 #0d121c,
        -2px 4px 0 #0a0e17,
        -3px 6px 0 #080b12,
        -4px 8px 0 #06090e,
        -6px 12px 0 #04060a,
        -8px 16px 0 #030408,
        -10px 20px 0 #020306,
        -14px 28px 0 #010204,
        /* Deep contact drop-shadow under keyboard */
        -20px 40px 50px rgba(0, 0, 0, 0.95),
        -10px 20px 30px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(97, 218, 251, 0.2);
    }

    /* 3D Keycap with extruded sides and dish scoop */
    .keycap-3d {
      transform-style: preserve-3d;
      position: relative;
      border-radius: 12px;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    /* Extrusion effect via CSS multi-layer shadows */
    .keycap-shadow {
      box-shadow:
        /* Top scoop bevel */
        0 1px 1px rgba(255, 255, 255, 0.4) inset,
        0 -1px 2px rgba(0, 0, 0, 0.4) inset,
        /* Physical extruded side walls of keycap */
        0 1px 0 var(--dark-color),
        0 2px 0 var(--dark-color),
        0 3px 0 var(--dark-color),
        0 4px 0 var(--dark-color),
        0 5px 0 var(--dark-color),
        0 6px 0 var(--dark-color),
        0 7px 0 #080c14,
        /* Key drop shadow onto switch plate */
        0 9px 12px rgba(0, 0, 0, 0.65);
    }

    .keycap-dish {
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.45), inset 0 -2px 4px rgba(0, 0, 0, 0.55);
    }
  </style>
</head>
<body class="p-12 flex flex-col items-center justify-center min-h-screen">

  <div class="text-center mb-8">
    <h1 class="text-3xl font-black tracking-wider uppercase text-white mb-2">3D Mechanical Keyboard Test</h1>
    <p class="text-slate-400 text-sm">Angle: rotateX(56deg) rotateY(10deg) rotateZ(-38deg) with authentic wedge elevation & thick chassis</p>
  </div>

  <div class="keyboard-stage my-8">
    <!-- Chassis -->
    <div class="keyboard-chassis p-5 rounded-[28px] bg-[#0c101a] border border-white/10 relative">
      
      <!-- Recessed Switch Plate Interior -->

        <!-- ROW 1 -->
        <!-- JS -->
        <div class="keycap-3d w-14 h-14 rounded-xl flex items-center justify-center font-bold text-black keycap-shadow" style="background: radial-gradient(ellipse at 50% 25%, rgba(255,255,255,0.4) 0%, transparent 60%), #F7DF1E; --dark-color: #BFA80A;">
          <div class="absolute inset-1 rounded-lg keycap-dish pointer-events-none"></div>
          <span class="text-lg font-black">JS</span>
        </div>

        <!-- React (Active Glow) -->

        <!-- Next.js -->

        <!-- PHP -->

        <!-- MySQL -->

      <!-- Bottom Edge Chamfer -->

</body>
</html>
