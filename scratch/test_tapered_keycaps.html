<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>All 24 Tools - Tight Spacing & Real 3D Keycaps</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .perspective-stage {
      perspective: 1200px;
      perspective-origin: 45% 40%;
    }

    .macropad-body {
      transform-style: preserve-3d;
      transform: rotateX(46deg) rotateY(-6deg) rotateZ(-36deg);
      background: #0c0e14;
      border-radius: 22px;
      padding: 8px 8px 12px 8px;
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.15) inset,
        0 -1px 0 rgba(0, 0, 0, 0.9) inset,
        1px 2px 0 #090b0e,
        2px 5px 0 #07080b,
        3px 8px 0 #050608,
        4px 12px 0 #030405,
        6px 16px 0 #010203,
        10px 24px 35px rgba(0,0,0,0.95),
        16px 40px 60px rgba(0,0,0,0.9);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    /* 
      TIGHT 3PX GAP: Keycaps are adjacent ("berdekatan jadi gak ada jarak antar keyboardnya")
      Natural crevice ("celah") between the top surfaces!
    */
    .keycaps-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3px;
      background: #040507;
      border-radius: 16px;
      padding: 5px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.95);
    }

    .keycap-btn {
      position: relative;
      width: 62px;
      height: 62px;
      border-radius: 14px;
      background: var(--bg);
      border: none;
      outline: none;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: transform 0.08s ease, filter 0.08s ease;
      
      box-shadow:
        0 1.5px 1px rgba(255, 255, 255, 0.5) inset,
        0 -1px 2px rgba(0, 0, 0, 0.4) inset,
        0 1px 0 var(--side),
        0 2px 0 var(--side),
        0 3px 0 var(--side),
        0 4px 0 var(--side),
        0 5px 0 var(--side),
        0 6px 0 var(--side),
        0 7px 0 var(--side-dark),
        0 8px 0 var(--side-dark),
        0 9px 0 #050608,
        0 10px 12px -2px rgba(0, 0, 0, 0.9),
        0 14px 18px -3px rgba(0, 0, 0, 0.7);
    }

    .keycap-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .keycap-btn:active {
      transform: translateY(5px);
      box-shadow:
        0 1px 0 var(--side),
        0 2px 0 var(--side),
        0 3px 0 #050608,
        0 5px 8px rgba(0,0,0,0.8),
        inset 0 2px 4px rgba(0,0,0,0.5);
    }

    .keycap-scoop {
      position: absolute;
      inset: 3px;
      border-radius: 11px;
      background: radial-gradient(circle at 45% 30%, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 65%);
      box-shadow: 
        inset 0 2px 4px rgba(255, 255, 255, 0.4),
        inset 0 -2px 4px rgba(0, 0, 0, 0.5);
      pointer-events-none;
    }

    .glyph-white {
      color: #ffffff;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.5));
      z-index: 10;
      position: relative;
    }
  </style>
</head>
<body class="p-8 flex flex-col items-center justify-center min-h-screen">

  <div class="text-center mb-8">
    <h2 class="text-5xl font-black tracking-widest text-white uppercase drop-shadow-[0_4px_16px_rgba(0,0,0,0.9)]">
      SKILLS
    </h2>
    <div class="text-slate-400 text-sm font-mono mt-1">(hint: press a key)</div>
  </div>

  <div class="flex items-center justify-center gap-16 max-w-6xl w-full">

    <div class="w-80 flex flex-col justify-center">
      <h3 id="inspector-title" class="text-6xl font-black text-white tracking-tight" style="text-shadow: 1px 1px 0 #cbd5e1, 2px 2px 0 #94a3b8, 3px 3px 0 #64748b, 4px 4px 0 #475569, 6px 6px 14px rgba(0,0,0,0.9);">
        Prettier
      </h3>
      <p id="inspector-desc" class="mt-3 text-lg text-slate-300 font-normal leading-relaxed">
        fixing your code not a whole mess, thank u next
      </p>
    </div>

    <div class="perspective-stage">
      <div class="macropad-body">
        <div class="keycaps-grid">

          <!-- ROW 1 -->
          <!-- 1: JS -->

            <div class="keycap-scoop"></div>
            <span class="glyph-white font-black text-2xl">JS</span>
          </button>
          <!-- 2: TS -->
          <button type="button" class="keycap-btn" style="--bg: #2563EB; --side: #1D4ED8; --side-dark: #12345C;">
            <div class="keycap-scoop"></div>

          <!-- 3: HTML5 -->

          <!-- 4: CSS3 -->

              <ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(0 12 12)" />
              <ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(60 12 12)" />

          <!-- 6: Next.js -->

          <button type="button" class="keycap-btn" style="--bg: #18181B; --side: #09090B; --side-dark: #000000; border: 1px solid rgba(255,255,255,0.15);">

          </button>
          <!-- 15: PostgreSQL / Prettier P -->
          <button type="button" class="keycap-btn" style="--bg: #1E293B; --side: #0F172A; --side-dark: #020617; border: 1px solid rgba(255,255,255,0.1);">
            <div class="keycap-scoop"></div>
            <span class="glyph-white font-mono font-black text-2xl tracking-tighter">P</span>
          </button>
          <!-- 16: npm -->
          <button type="button" class="keycap-btn" style="--bg: #DC2626; --side: #991B1B; --side-dark: #450A0A;">
            <div class="keycap-scoop"></div>
            <span class="glyph-white font-black text-sm">npm</span>
          </button>
          <!-- 17: MySQL -->
          <button type="button" class="keycap-btn" style="--bg: #F59E0B; --side: #B45309; --side-dark: #78350F;">
            <div class="keycap-scoop"></div>
            <span class="glyph-white font-black text-xs tracking-wider">SQL</span>
          </button>
          <!-- 18: Java / AWS -->
          <button type="button" class="keycap-btn" style="--bg: #EA580C; --side: #C2410C; --side-dark: #7C2D12;">
            <div class="keycap-scoop"></div>
            <span class="glyph-white font-black text-xs">aws</span>
          </button>

          <!-- ROW 4 -->

            <div class="keycap-scoop"></div>

  </div>

</body>
</html>
