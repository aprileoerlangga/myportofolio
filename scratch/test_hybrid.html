<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hybrid Tapered + 3D Height Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #020306;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .perspective-stage {
      perspective: 1200px;
      perspective-origin: 45% 40%;
    }

    .macropad-body {
      transform-style: preserve-3d;
      transform: rotateX(46deg) rotateY(-6deg) rotateZ(-36deg);
      background: #05070c;
      border-radius: 18px;
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.15) inset,
        0 -1px 0 rgba(0, 0, 0, 0.9) inset,
        -1px 2px 0 #040508,
        -2px 5px 0 #020305,
        -3px 8px 0 #010203,
        -4px 12px 0 #000102,
        -8px 20px 30px rgba(0,0,0,0.95),
        -14px 35px 50px rgba(0,0,0,0.9);
    }

    .switch-plate {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 3.5px;
      background: #000002;
      border-radius: 14px;
      padding: 5px;
      box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.98);
      transform-style: preserve-3d;
    }

    /* 
      HYBRID KEYCAP:
      1. Tapered outer base skirt (linear-gradient)
      2. 3D physical height extrusion down to plate (-X and +Y)
      3. Elevated resting height so the crevice goes deep down!
    */
    .keycap-hybrid {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 12px;
      padding: 4.5px;
      background: linear-gradient(135deg, var(--side) 0%, var(--side-dark) 100%);
      border: none;
      outline: none;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform 0.08s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.08s cubic-bezier(0.2, 0.8, 0.2, 1);
      
      /* 
        Tall 3D Extruded Base Skirt:
        First 4px uses bright --side for high-visibility colored walls!
      */
      box-shadow:
        0 1px 1px rgba(255, 255, 255, 0.4) inset,
        -1px 1px 0 var(--side),
        -2px 2px 0 var(--side),
        -3px 3px 0 var(--side),
        -4px 4px 0 var(--side),
        -5px 5px 0 var(--side-dark),
        -6px 6px 0 var(--side-dark),
        -7px 7px 0 #06080e,
        -8px 8px 0 #020305,
        -11px 12px 16px rgba(0, 0, 0, 0.95),
        -5px 6px 8px rgba(0, 0, 0, 0.8);
    }

    .keycap-hybrid:hover {
      transform: translate(-1px, 1px);
    }

    /* Deep mechanical press into switch plate */
    .keycap-hybrid:active, .keycap-hybrid.pressed {
      transform: translate(-4.5px, 4.5px);
      box-shadow:
        -1px 1px 0 #020305,
        -2px 2px 4px rgba(0, 0, 0, 0.9);
    }

    .keycap-top {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 1.5px 1px rgba(255, 255, 255, 0.55) inset,
        0 -1px 2px rgba(0, 0, 0, 0.45) inset,
        -1px 1.5px 2px rgba(0, 0, 0, 0.35);
    }

    .keycap-dish {
      position: absolute;
      inset: 2px;
      border-radius: 6px;
      background: radial-gradient(circle at 45% 30%, rgba(255, 255, 255, 0.36) 0%, rgba(255, 255, 255, 0) 65%);
      box-shadow: 
        inset 0 1.5px 3px rgba(255, 255, 255, 0.4),
        inset 0 -1.5px 3px rgba(0, 0, 0, 0.5);
      pointer-events-none;
    }

    .key-glyph {
      position: relative;
      z-index: 10;
      color: #ffffff;
      filter: drop-shadow(0 1.5px 2px rgba(0, 0, 0, 0.6));
      pointer-events-none;
    }
  </style>
</head>
