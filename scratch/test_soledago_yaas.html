<!DOCTYPE html>
<html>
<head>
  <style>
    @font-face {
      font-family: 'Soledago';
      src: url('/fonts/Soledago.woff2') format('woff2');
      font-weight: normal;
      font-style: normal;
    }
    @font-face {
      font-family: 'Bounded';
      src: url('/fonts/Bounded-Medium.woff2') format('woff2');
      font-weight: 500;
      font-style: normal;
    }
    body {
      margin: 0;
      background: #090b14;
      color: white;
      font-family: 'Bounded', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    .headline {
      font-family: 'Soledago', cursive, sans-serif;
      text-align: center;
      text-transform: uppercase;
      font-size: 58px;
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin-bottom: 40px;
    }
    .headline .black-text {
      color: #ffffff;
    }
    .headline .pink-text {
      color: #ff2d55;
      text-shadow: 0 0 35px rgba(255, 45, 85, 0.4);
    }
    .arc-stage {
      position: relative;
      width: 100vw;
      height: 280px;
      perspective: 1200px;
      transform-style: preserve-3d;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      position: absolute;
      width: 360px;
      height: 240px;
      border-radius: 28px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      transform-style: preserve-3d;
    }
    .subline {
      font-family: 'Bounded', sans-serif;
      text-align: center;
      color: #e5e5e5;
      font-size: 17px;
      line-height: 1.5;
      margin-top: 40px;
      max-width: 500px;
    }
  </style>
</head>
<body>
  <div class="headline">
    <div class="black-text">THIS ISN'T ABOUT HYPING</div>
    <div>
      <span class="black-text">YOU UP. </span>
      <span class="pink-text">IT'S ABOUT STAYING</span>
    </div>
    <div class="pink-text">LOCKED IN TO YOUR OWN THING.</div>
  </div>

  <div class="arc-stage">
    <div class="card" style="transform: translateX(-560px) translateZ(-160px) rotateY(32deg) scale(0.9); opacity: 0.65;">
      <div style="width:100%;height:100%;background:#3b82f6;"></div>
    </div>
    <div class="card" style="transform: translateX(-280px) translateZ(-65px) rotateY(16deg) scale(0.95); opacity: 0.85;">
      <div style="width:100%;height:100%;background:#14b8a6;"></div>
    </div>
    <div class="card" style="transform: translateX(0px) translateZ(0px) rotateY(0deg) scale(1.0); opacity: 1; z-index: 10;">
      <div style="width:100%;height:100%;background:#eab308;"></div>
    </div>
    <div class="card" style="transform: translateX(280px) translateZ(-65px) rotateY(-16deg) scale(0.95); opacity: 0.85;">
      <div style="width:100%;height:100%;background:#06b6d4;"></div>
    </div>
    <div class="card" style="transform: translateX(560px) translateZ(-160px) rotateY(-32deg) scale(0.9); opacity: 0.65;">
      <div style="width:100%;height:100%;background:#ec4899;"></div>
    </div>
  </div>

  <div class="subline">
    You don't build software on a schedule<br />
    — you engineer it when you need to<br />
    show up 100%.
  </div>
</body>
</html>
