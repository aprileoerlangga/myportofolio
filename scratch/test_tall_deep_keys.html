<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tall Deep Keycaps Test</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #000000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 50px;
    }

    .perspective-stage {
      perspective: 1200px;
      perspective-origin: 45% 40%;
    }

    .macropad-body {
      transform-style: preserve-3d;
      transform: rotateX(46deg) rotateY(-6deg) rotateZ(-36deg);
      background: #05070c;
      border-radius: 24px;
      padding: 10px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.22) inset,
        0 -1px 0 rgba(0, 0, 0, 0.95) inset,
        -1px 2px 0 #05070a,
        -2px 5px 0 #030407,
        -4px 9px 0 #020305,
        -6px 15px 0 #010203,
        -10px 24px 38px rgba(0,0,0,0.98),
        -18px 46px 65px rgba(0,0,0,0.95);
    }

    .switch-plate {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 9px;
      background: #000002;
      border-radius: 18px;
      padding: 8px;
      box-shadow: inset 0 8px 30px rgba(0, 0, 0, 0.99);
      transform-style: preserve-3d;
    }

    /* 
      AUTHENTIC SA HIGH-PROFILE MECHANICAL KEYCAP:
      - Tall 14px physical height extrusion down to plate
      - Deep 8px mechanical plunge actuation
      - Crystal clear pure white SVG logos with drop shadow
    */
    .keycap-tall {
      position: relative;
      width: 62px;
      height: 62px;
      border-radius: 13px;
      padding: 6px;
      background: linear-gradient(135deg, var(--side) 0%, var(--side-dark) 100%);
      border: none;
      outline: none;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform 0.08s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.08s cubic-bezier(0.2, 0.8, 0.2, 1);
      
      box-shadow:
        0 1px 1.5px rgba(255, 255, 255, 0.5) inset,
        -1px 1px 0 var(--side),
        -2px 2px 0 var(--side),
        -3px 3px 0 var(--side),
        -4px 4px 0 var(--side),
        -5px 5px 0 var(--side),
        -6px 6px 0 var(--side),
        -7px 7px 0 var(--side-dark),
        -8px 8px 0 var(--side-dark),
        -9px 9px 0 var(--side-dark),
        -10px 10px 0 var(--side-dark),
        -11px 11px 0 #080c14,
        -12px 12px 0 #05070c,
        -13px 13px 0 #020306,
        -14px 14px 0 #000002,
        -18px 20px 28px rgba(0, 0, 0, 0.98),
        -8px 10px 14px rgba(0, 0, 0, 0.88);
    }

    .keycap-tall:hover {
      transform: translate(-2px, 2px);
    }

    /* DEEP 8PX ACTUATION TRAVEL */
    .keycap-tall:active, .keycap-tall.pressed {
      transform: translate(-8px, 8px);
      box-shadow:
        -1px 1px 0 #020305,
        -2px 2px 4px rgba(0, 0, 0, 0.9),
        inset 0 2px 6px rgba(0, 0, 0, 0.75);
    }

    .keycap-top {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 8px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 1.5px 1px rgba(255, 255, 255, 0.65) inset,
        0 -1px 2px rgba(0, 0, 0, 0.55) inset,
        -1px 1.5px 2px rgba(0, 0, 0, 0.4);
    }

    .keycap-dish {
      position: absolute;
      inset: 2px;
      border-radius: 6px;
      background: radial-gradient(circle at 45% 30%, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0) 65%);
      box-shadow: inset 0 1.5px 3px rgba(255, 255, 255, 0.45), inset 0 -1.5px 3px rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }

    .keycap-symbol {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      pointer-events: none;
      filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.8));
    }

    .keycap-ring {
      position: absolute;
      inset: 0;
      border-radius: 8px;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.95), 0 0 16px rgba(255, 255, 255, 0.6);
      pointer-events: none;
    }
  </style>
</head>

    const container = document.getElementById('switchPlate');

    SKILLS.forEach((skill, index) => {
      const btn = document.createElement('button');
      btn.className = 'keycap-tall' + (index === 4 ? ' active' : '');
      btn.style.setProperty('--bg', skill.bg);
      btn.style.setProperty('--side', skill.side);
      btn.style.setProperty('--side-dark', skill.sideDark);
      
      // Precision Isometric Layering: rows in front and columns to the left sit on top
      const zIndex = (skill.row * 10) + (6 - skill.col);
      btn.style.zIndex = zIndex;
      btn.title = skill.name;

      let symbolHtml = '';
      if (skill.text) {
        symbolHtml = `<span class="font-black text-2xl tracking-tight leading-none text-white ${skill.italic ? 'italic' : ''}">${skill.text}</span>`;
      } else if (ICONS[skill.icon]) {
        symbolHtml = ICONS[skill.icon];
      }

      btn.innerHTML = `
        <div class="keycap-top">
          <div class="keycap-dish"></div>
          <div class="keycap-symbol">${symbolHtml}</div>
          ${index === 4 ? '<div class="keycap-ring"></div>' : ''}
        </div>
      `;

      btn.addEventListener('click', () => {
        document.querySelectorAll('.keycap-ring').forEach(r => r.remove());
        btn.querySelector('.keycap-top').insertAdjacentHTML('beforeend', '<div class="keycap-ring"></div>');
        btn.classList.add('pressed');
        btn.style.zIndex = 120;
        setTimeout(() => {
          btn.classList.remove('pressed');
          btn.style.zIndex = zIndex;
        }, 150);
      });

      container.appendChild(btn);
    });
  </script>
