<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Real Depth V3 Keyboard Verification</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: #000000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 40px;
    }

    .perspective-stage {
      perspective: 1200px;
      perspective-origin: 45% 40%;
    }

    .macropad-body {
      transform-style: preserve-3d;
      transform: rotateX(46deg) rotateY(-6deg) rotateZ(-36deg);
      background: #05070c;
      border-radius: 20px;
      padding: 7px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow:
        0 1px 0 rgba(255, 255, 255, 0.18) inset,
        0 -1px 0 rgba(0, 0, 0, 0.95) inset,
        -1px 2px 0 #040508,
        -2px 5px 0 #020305,
        -3px 8px 0 #010203,
        -5px 14px 0 #000102,
        -8px 22px 35px rgba(0,0,0,0.98),
        -14px 38px 55px rgba(0,0,0,0.95);
    }

    .switch-plate {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      background: #000002;
      border-radius: 15px;
      padding: 6px;
      box-shadow: inset 0 6px 25px rgba(0, 0, 0, 0.99);
      transform-style: preserve-3d;
    }

    /* 
      AUTHENTIC SA HIGH-PROFILE MECHANICAL KEYCAP:
      - 5.5px tapered outer pyramid skirt
      - 14px solid extruded side walls (-X and +Y)
      - Deep bottom-out depression travel
    */
    .keycap-sa {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 12px;
      padding: 5.5px;
      background: linear-gradient(135deg, var(--side) 0%, var(--side-dark) 100%);
      border: none;
      outline: none;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
      transition: transform 0.08s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.08s cubic-bezier(0.2, 0.8, 0.2, 1);
      
      box-shadow:
        0 1px 1.5px rgba(255, 255, 255, 0.45) inset,
        -1px 1px 0 var(--side),
        -2px 2px 0 var(--side),
        -3px 3px 0 var(--side),
        -4px 4px 0 var(--side),
        -5px 5px 0 var(--side),
        -6px 6px 0 var(--side-dark),
        -7px 7px 0 var(--side-dark),
        -8px 8px 0 var(--side-dark),
        -9px 9px 0 #080c14,
        -10px 10px 0 #05070c,
        -11px 11px 0 #020306,
        -12px 12px 0 #000002,
        -16px 18px 24px rgba(0, 0, 0, 0.98),
        -8px 10px 12px rgba(0, 0, 0, 0.88);
    }

    .keycap-sa:hover {
      transform: translate(-1.5px, 1.5px);
    }

    .keycap-sa:active, .keycap-sa.pressed {
      transform: translate(-6px, 6px);
      box-shadow:
        -1px 1px 0 #020305,
        -2px 2px 4px rgba(0, 0, 0, 0.9),
        inset 0 2px 6px rgba(0, 0, 0, 0.7);
    }

    .keycap-top {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 7.5px;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 1.5px 1px rgba(255, 255, 255, 0.6) inset,
        0 -1px 2px rgba(0, 0, 0, 0.5) inset,
        -1px 1.5px 2px rgba(0, 0, 0, 0.4);
    }

    .keycap-dish {
      position: absolute;
      inset: 2px;
      border-radius: 5.5px;
      background: radial-gradient(circle at 45% 30%, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0) 65%);
      box-shadow: inset 0 1.5px 3px rgba(255, 255, 255, 0.45), inset 0 -1.5px 3px rgba(0, 0, 0, 0.55);
      pointer-events: none;
    }

    .keycap-content {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      filter: drop-shadow(0 1.5px 2px rgba(0, 0, 0, 0.7));
      pointer-events: none;
    }

    .keycap-selected-ring {
      position: absolute;
      inset: 0;
      border-radius: 7.5px;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.95), 0 0 15px rgba(255, 255, 255, 0.5);
      pointer-events: none;
    }
  </style>
</head>

    SKILLS.forEach((skill, index) => {
      const btn = document.createElement('button');
      btn.className = 'keycap-sa' + (index === 0 ? ' active' : '');
      btn.style.setProperty('--bg', skill.bg);
      btn.style.setProperty('--side', skill.side);
      btn.style.setProperty('--side-dark', skill.sideDark);
      btn.title = skill.name;

      let innerContent = '';
      if (skill.isNextBadge) {
        innerContent = `
          <div class="w-6 h-6 rounded-full bg-white flex items-center justify-center shadow">
            <svg viewBox="0 0 32 32" width="16" height="16" fill="none">

            </svg>
          </div>
        `;

        innerContent = `
          <div class="w-5 h-5 bg-white rounded-[4px] flex items-center justify-center transform rotate-45 shadow">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="#EF4444" class="transform -rotate-45">

            </svg>
          </div>
        `;
      } else if (skill.text) {
        innerContent = `<span class="font-black text-xl tracking-tight text-white ${skill.isItalic ? 'italic' : ''}">${skill.text}</span>`;
      } else if (skill.icon && ICONS[skill.icon]) {
        innerContent = ICONS[skill.icon];
      }

      btn.innerHTML = `
        <div class="keycap-top">
          <div class="keycap-dish"></div>
          <div class="keycap-content">
            ${innerContent}
          </div>
          ${index === 4 ? '<div class="keycap-selected-ring"></div>' : ''}
        </div>
      `;

      btn.addEventListener('click', () => {
        document.querySelectorAll('.keycap-selected-ring').forEach(r => r.remove());
        btn.querySelector('.keycap-top').insertAdjacentHTML('beforeend', '<div class="keycap-selected-ring"></div>');
        btn.classList.add('pressed');
        setTimeout(() => btn.classList.remove('pressed'), 140);
      });

      container.appendChild(btn);
    });
