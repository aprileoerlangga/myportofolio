<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>3D Cylindrical Arc Preview (Wider Cards)</title>
<style>
  @font-face {
    font-family: 'Arcadepix';
    src: url('/fonts/arcadepix.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
  }

  body {
    margin: 0;
    background: #060a17;
    color: white;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    height: 100vh;
    overflow: hidden;
    padding: 60px 20px 40px;
    box-sizing: border-box;
    background-image: 
      radial-gradient(ellipse 90% 65% at 75% 35%, rgba(0, 85, 191, 0.12), transparent 70%),
      radial-gradient(ellipse 70% 55% at 20% 30%, rgba(255, 213, 0, 0.07), transparent 65%),
      radial-gradient(circle 850px at 50% 115%, rgba(14, 165, 233, 0.08), transparent 70%);
  }

  .header {
    text-align: center;
    user-select: none;
    z-index: 10;
  }

  .header h2 {
    font-family: 'Arcadepix', monospace;
    font-size: 56px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #ffffff;
    text-shadow: 0 4px 25px rgba(0,0,0,0.9);
    margin: 0;
  }

  .header h2 span {
    color: #FFD500;
    text-shadow: 0 0 35px rgba(255, 213, 0, 0.65);
  }

  .stage {
    position: relative;
    width: 100vw;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
    transform: translateY(30px);
  }

  /* Card Width refined to 382px for optimal aesthetic cylinder perspective */
  .card {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 382px;
    height: 273px;
    border-radius: 20px;
    overflow: hidden;
    background: #070b16;
    box-shadow: 0 25px 60px rgba(0,0,0,0.9);
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.22);
    user-select: none;
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease;
  }

  .card:hover {
    box-shadow: 0 30px 70px rgba(255,213,0,0.3);
    border-color: rgba(255,213,0,0.7);
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top;
  }

  .card .vignette {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.3) 45%, transparent 70%);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .card .card-info {
    position: absolute;
    inset-x: 0;
    bottom: 0;
    padding: 18px 20px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    pointer-events: none;
    z-index: 10;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .card:hover .vignette,
  .card:hover .card-info {
    opacity: 1;
  }

  .card .title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 19px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: white;
    text-shadow: 0 2px 10px rgba(0,0,0,0.95);
    line-height: 1.25;
  }

  .subline {
    text-align: center;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: #cbd5e1;
    font-size: 15px;
    font-weight: 400;
    max-width: 600px;
    margin: 0 auto;
    user-select: none;
    z-index: 10;
  }
</style>
</head>
<body>

  <!-- Theme Header (Top) -->
  <div class="header">
    <h2>MY <span>PROJECTS</span></h2>
  </div>

  <!-- 3D Arc Stage (Wider 480px Cards) -->
  <div class="stage" id="stage">
    <!-- Card 0: Far Left (h=-2) -->
    <div class="card" style="transform: translate(-50%, -50%) translate3d(-1020px, 0, 0) perspective(1200px) translateZ(494px) rotateY(48deg); z-index: 8;">
      <img src="../src/assets/RosaStore.png" alt="Rosa Store" />
      <div class="vignette"></div>
      <div class="card-info">
        <span class="title">Web E-commerce Handphone</span>
      </div>
    </div>

    <!-- Card 1: Mid Left (h=-1) -->
    <div class="card" style="transform: translate(-50%, -50%) translate3d(-510px, 0, 0) perspective(1200px) translateZ(209px) rotateY(24deg); z-index: 9;">
      <img src="../src/assets/Iwakmart Mobile.jpg" alt="Iwakmart" />
      <div class="vignette"></div>
      <div class="card-info">
        <span class="title">Iwakmart Fishery App</span>
      </div>
    </div>

    <!-- Card 2: Center (h=0) -->
    <div class="card" style="transform: translate(-50%, -50%) translate3d(0px, 0, 0) perspective(1200px) translateZ(0px) rotateY(0deg); z-index: 10;">
      <img src="../src/assets/IoT.png" alt="IoT GPS Tracker" />
      <div class="vignette"></div>
      <div class="card-info">
        <span class="title">IoT GPS Tracker Bagpack</span>
      </div>
    </div>

    <!-- Card 3: Mid Right (h=+1) -->
    <div class="card" style="transform: translate(-50%, -50%) translate3d(510px, 0, 0) perspective(1200px) translateZ(209px) rotateY(-24deg); z-index: 9;">
      <img src="../src/assets/Web Portoku.jpeg" alt="Personal Portfolio" />
      <div class="vignette"></div>
      <div class="card-info">
        <span class="title">Interactive 3D Experience</span>
      </div>
    </div>

    <!-- Card 4: Far Right (h=+2) -->
    <div class="card" style="transform: translate(-50%, -50%) translate3d(1020px, 0, 0) perspective(1200px) translateZ(494px) rotateY(-48deg); z-index: 8;">
      <img src="../src/assets/FishAI.png" alt="Fish AI Diagnostics" />
      <div class="vignette"></div>
      <div class="card-info">
        <span class="title">Aplikasi Mobile Fish AI</span>
      </div>
    </div>
  </div>

  <!-- Editorial Subline (Bottom) -->
  <div class="subline">
    A curated collection of web applications, mobile ecosystems, and interactive digital experiences.
  </div>

</body>
</html>
