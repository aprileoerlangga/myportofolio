<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Modern Obsidian Squircle Base -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#070B19"/>
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="#FFD500" stroke-opacity="0.85" stroke-width="2.6"/>

  <!-- Subtle Ambient Glow inside container -->
  <defs>
    <radialGradient id="studGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FFE600" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFD500" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="6" y="6" width="88" height="88" rx="18" fill="url(#studGlow)" pointer-events="none"/>

  <!-- Top Cylindrical Stud -->
  <rect x="36" y="10" width="28" height="12" rx="3.2" fill="#FFD500" stroke="#AA7300" stroke-width="2"/>
  <ellipse cx="50" cy="14" rx="9" ry="2.2" fill="#FFF8A0"/>

  <!-- Main Lego Head Cylinder -->
  <rect x="17" y="20" width="66" height="67" rx="17" fill="#FFD500" stroke="#AA7300" stroke-width="2.2"/>

  <!-- Forehead Specular 3D Highlight -->
  <path d="M25 31 Q50 21 75 31" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" opacity="0.7"/>

  <!-- Eyebrows -->
  <path d="M27 38.5 Q35.5 33 43.5 38.5" stroke="#733C00" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  <path d="M56.5 37.5 Q64.5 31.5 72.5 37.5" stroke="#733C00" stroke-width="2.6" stroke-linecap="round" fill="none"/>

  <!-- Left Eye with Crisp Catchlight -->
  <circle cx="35.5" cy="47.5" r="5.5" fill="#18181B"/>
  <circle cx="37.4" cy="45.6" r="1.9" fill="#FFFFFF"/>

  <!-- Right Eye: Playful Wink -->
  <path d="M56 49.5 Q64.5 39.5 73 49.5" stroke="#18181B" stroke-width="4.5" stroke-linecap="round" fill="none"/>

  <!-- Mouth: Playful Melet (Open Smile Cavity + Sticking Tongue Out) -->
  <path d="M31 56.5 Q50 75 69 56.5 Q50 60.5 31 56.5 Z" fill="#2B090E" stroke="#18181B" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M29.5 54 L32 59.5" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>
  <path d="M70.5 54 L68 59.5" stroke="#18181B" stroke-width="2.8" stroke-linecap="round"/>

  <!-- Tongue sticking out -->
  <path d="M39.5 59.5 C39.5 74.5 42.5 82.5 50 82.5 C57.5 82.5 60.5 74.5 60.5 59.5 Z" fill="#FF4B72" stroke="#18181B" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M50 62 L50 76.5" stroke="#C9184A" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse cx="45" cy="67.5" rx="2.3" ry="3.8" fill="#FF8FA3" opacity="0.85"/>
</svg>
