<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Modern Obsidian Squircle Base -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#070B19"/>
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="#FFD500" stroke-opacity="0.85" stroke-width="2.6"/>
  
  <!-- Subtle Ambient Glow inside container -->
  <radialGradient id="studGlow" cx="50%" cy="40%" r="50%">
    <stop offset="0%" stop-color="#FFE600" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#FFD500" stop-opacity="0"/>
  </radialGradient>
  <rect x="6" y="6" width="88" height="88" rx="18" fill="url(#studGlow)" pointer-events="none"/>

  <!-- Top Cylindrical Stud -->
  <rect x="36" y="10" width="28" height="12" rx="3.2" fill="#FFD500" stroke="#AA7300" stroke-width="2"/>
  <ellipse cx="50" cy="14" rx="9" ry="2.2" fill="#FFF8A0"/>

  <!-- Main Lego Head Cylinder -->
  <rect x="17" y="20" width="66" height="67" rx="17" fill="#FFD500" stroke="#AA7300" stroke-width="2.2"/>
  
  <!-- Forehead Specular 3D Highlight -->
  <path d="M25 32 Q50 20 75 32" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" opacity="0.7"/>

  <!-- Eyebrows -->
  <path d="M29 42 Q36 34 43 42" stroke="#733C00" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M57 42 Q64 34 71 42" stroke="#733C00" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Left Eye with Crisp Catchlight -->
  <circle cx="36" cy="49.5" r="5.4" fill="#18181B"/>
  <circle cx="37.8" cy="47.7" r="1.8" fill="#FFFFFF"/>

  <!-- Right Eye with Crisp Catchlight -->
  <circle cx="64" cy="49.5" r="5.4" fill="#18181B"/>
  <circle cx="65.8" cy="47.7" r="1.8" fill="#FFFFFF"/>

  <!-- Classic Confident Lego Smile -->
  <path d="M33 55 Q50 78 67 55" stroke="#18181B" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Smile Dimples -->
  <path d="M33 60 L34.8 64.5" stroke="#18181B" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M67 60 L65.2 64.5" stroke="#18181B" stroke-width="2.6" stroke-linecap="round"/>
</svg>
