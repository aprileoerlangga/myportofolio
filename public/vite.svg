<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <!-- Sleek Obsidian Squircle Container (Consistent on Light & Dark browser tabs) -->
  <rect width="36" height="36" rx="9" fill="#060A17"/>
  <rect x="0.5" y="0.5" width="35" height="35" rx="8.5" stroke="#FFD500" stroke-opacity="0.4" stroke-width="1"/>
  
  <g transform="translate(2, 2)">
    <!-- Top Stud -->
    <rect x="11" y="2" width="10" height="4.5" rx="1.5" fill="#FFD500" stroke="#9A6B00" stroke-width="1.2"/>
    <ellipse cx="16" cy="3.5" rx="3.5" ry="1.2" fill="#FFF785"/>

    <!-- Head Main Cylinder -->
    <rect x="4" y="6" width="24" height="25" rx="6.5" fill="#FFD500" stroke="#9A6B00" stroke-width="1.2"/>
    
    <!-- Forehead Specular Highlight -->
    <path d="M8 9.5 Q16 8 24 9.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>

    <!-- Eyebrows -->
    <path d="M9.5 13.5 Q11.5 12 13.5 13.5" stroke="#4A2600" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <path d="M18.5 13.5 Q20.5 12 22.5 13.5" stroke="#4A2600" stroke-width="1.1" stroke-linecap="round" fill="none"/>

    <!-- Left Eye with Crisp Catchlight -->
    <circle cx="11.5" cy="17" r="2" fill="#18181B"/>
    <circle cx="12.2" cy="16.3" r="0.75" fill="#FFFFFF"/>

    <!-- Right Eye with Crisp Catchlight -->
    <circle cx="20.5" cy="17" r="2" fill="#18181B"/>
    <circle cx="21.2" cy="16.3" r="0.75" fill="#FFFFFF"/>

    <!-- Classic Happy Lego Smile -->
    <path d="M10.5 22 Q16 27.5 21.5 22" stroke="#18181B" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M10.2 21.2 L10.8 22.8" stroke="#18181B" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M21.8 21.2 L21.2 22.8" stroke="#18181B" stroke-width="1.3" stroke-linecap="round"/>
  </g>
</svg>
